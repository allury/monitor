name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [.github/release-version]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate release version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=$(cat .github/release-version)
          fi
          printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          test "$tag" = "v$version"
          test -f "docs/releases/$tag.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            binary: monitor-server
            feature: server
            artifact: monitor-server-linux-amd64
          - target: aarch64-unknown-linux-musl
            binary: monitor-server
            feature: server
            artifact: monitor-server-linux-arm64
          - target: x86_64-unknown-linux-musl
            binary: monitor-agent
            feature: agent
            artifact: monitor-agent-linux-amd64
          - target: aarch64-unknown-linux-musl
            binary: monitor-agent
            feature: agent
            artifact: monitor-agent-linux-arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build static binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release --bin ${{ matrix.binary }} --features ${{ matrix.feature }}"
          strip: true
      - name: Stage artifact
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it." >&2
            exit 1
          fi
          if existing_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null); then
            test "$existing_commit" = "$GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" \
            artifacts/* \
            deploy/install-server.sh \
            deploy/install-agent.sh \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Monitor $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
