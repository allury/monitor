name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Formatting
        run: cargo fmt --all --check
      - name: Rust dependency audit
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz -o "$RUNNER_TEMP/cargo-audit.tgz"
          printf '%s  %s\n' ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39 "$RUNNER_TEMP/cargo-audit.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit" audit --deny warnings
      - name: Shell scripts
        run: shellcheck deploy/*.sh tests/*.sh
      - name: Static checks
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-features
      - name: JavaScript syntax
        run: |
          node --check src/ui/app.js
          node --check src/ui/admin.js
          node --check src/ui/theme.js
          node --check src/ui/navigation.js
          node --test tests/*.test.mjs
      - name: Read-only service sandbox
        run: sh tests/check-sandbox.sh
      - name: Release builds
        run: |
          cargo build --release --bin monitor-server --features server
          cargo build --release --bin monitor-agent --features agent
      - name: Controller and agent integration
        env:
          MONITOR_TEST_SANDBOX: '1'
        run: node tests/integration.mjs target/release/monitor-server target/release/monitor-agent
