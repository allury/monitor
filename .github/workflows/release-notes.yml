name: Sync release descriptions

on:
  push:
    branches: [main]
    paths:
      - docs/releases/*.md
      - .github/workflows/release-notes.yml
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Update existing descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          for notes in docs/releases/*.md; do
            tag="${notes##*/}"
            tag="${tag%.md}"
            if ! printf '%s\n' "$published" | grep -Fxq -- "$tag"; then
              echo "Not published yet: $tag"
              continue
            fi
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          done
