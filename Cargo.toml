[package]
name = "monitor"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "A deliberately small, read-only Linux server monitor"

[features]
default = []
agent = [
    "dep:anyhow",
    "dep:futures-util",
    "dep:http",
    "dep:libc",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tracing",
    "dep:tracing-subscriber",
]
server = [
    "dep:anyhow",
    "dep:axum",
    "dep:base64",
    "dep:chrono",
    "dep:futures-util",
    "dep:rand",
    "dep:rusqlite",
    "dep:sha2",
    "dep:subtle",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[[bin]]
name = "monitor-server"
path = "src/bin/monitor-server.rs"
required-features = ["server"]

[[bin]]
name = "monitor-agent"
path = "src/bin/monitor-agent.rs"
required-features = ["agent"]

[dependencies]
anyhow = { version = "1.0", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"], optional = true }
futures-util = { version = "0.3", optional = true }
http = { version = "1.2", optional = true }
libc = { version = "0.2", optional = true }
rand = { version = "0.8", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
subtle = { version = "2.6", optional = true }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
tempfile = "3.16"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
